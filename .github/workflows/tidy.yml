name: tidy

# Every module replaces mcpkit with ../../mcpkit/main, so whenever mcpkit main
# changes its own requires, every go.mod here goes stale at once. main turns red
# with "updates to go.mod needed" and `make dogfood` refuses to start (#73).
# This runs the same `make sync-mcpkit` a person would and keeps one PR open
# with the result. It never merges.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: tidy

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chakra/main
    env:
      BRANCH: bot/sync-mcpkit
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: chakra/main
      - uses: actions/checkout@v7
        with:
          repository: panyam/mcpkit
          ref: main
          path: mcpkit/main

      - uses: actions/setup-go@v7
        with:
          go-version-file: chakra/main/go.mod
          cache-dependency-path: chakra/main/**/go.sum

      - name: Sync with mcpkit main
        run: make sync-mcpkit

      # mcpkit bumps its sub-module requires a little before it pushes the
      # tag, so a run that lands in between would propose an untagged pin.
      # That is a wait, not a failure: the next run picks it up.
      - name: Decide
        id: decide
        run: |
          if git diff --quiet; then
            echo "action=none" >> "$GITHUB_OUTPUT"
          elif python3 scripts/check_tagged_requires.py; then
            echo "action=propose" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::mcpkit main pins a version that is not tagged yet; waiting for the release"
            echo "action=wait" >> "$GITHUB_OUTPUT"
          fi

      # Someone tidied main by hand, so an open bot PR is now redundant.
      - name: Close a redundant PR
        if: steps.decide.outputs.action == 'none'
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          [ -z "$pr" ] || gh pr close "$pr" --delete-branch --comment "main already matches mcpkit main."

      - name: Open or update the PR
        if: steps.decide.outputs.action == 'propose'
        run: |
          rev=$(git -C ../../mcpkit/main rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -qam "deps: sync go.mod files with mcpkit main ($rev)"
          git push -qf origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "deps: sync go.mod files with mcpkit main" \
              --body "Generated by \`.github/workflows/tidy.yml\` running \`make sync-mcpkit\` against mcpkit main. Every \`github.com/panyam/*\` pin in it is tagged. Re-runs every six hours force-push this branch, so it always shows the latest mcpkit main. See #73."
          fi
          # A push or PR made with GITHUB_TOKEN starts no workflow runs, so
          # the PR's checks would never appear. Dispatch is the exception.
          gh workflow run test.yml --ref "$BRANCH"
