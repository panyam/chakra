name: test

on:
  push:
    branches: [main]
  pull_request:
  # tidy.yml dispatches this on its PR branch, since its pushes start no runs.
  workflow_dispatch:

jobs:
  # Whole-tree scan, by magic bytes rather than filename. The local pre-commit
  # hook is opt-in and bypassable with --no-verify, so this is the actual gate.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Whole-tree scan by magic bytes rather than filename. The local
      # pre-commit hook is opt-in and bypassable with --no-verify, so this is
      # the actual gate.
      - run: sh scripts/check-no-binaries.sh

      - run: sh scripts/check-ext-isolation.sh

      # MVS resolves to the maximum required version, so a split pin means the
      # lower modules silently build against the higher version. Catching it on
      # the PR that introduces it beats an unexplained failure weeks later in a
      # module nobody edited. Stdlib-only Python, so no install step.
      - run: python3 scripts/check_dep_consistency.py

  # Both jobs below walk the Makefile's MODULES and EXAMPLES rather than listing
  # modules again here. A restated list is a list that goes stale: a new module
  # builds fine locally, is absent from CI, and nothing says so. The per-module
  # reasoning that used to sit in these steps moved next to those variables.
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chakra/main
    steps:
      # Every module replaces mcpkit with ../../mcpkit/main so local work
      # tracks mcpkit's main branch. Lay the runner out the same way as a
      # local checkout: chakra/main and mcpkit/main side by side.
      - uses: actions/checkout@v7
        with:
          path: chakra/main
      - uses: actions/checkout@v7
        with:
          repository: panyam/mcpkit
          ref: main
          path: mcpkit/main

      - uses: actions/setup-go@v7
        with:
          go-version-file: chakra/main/go.mod
          cache-dependency-path: chakra/main/**/go.sum

      # Lives here rather than in `gates` because it needs the Go toolchain
      # that job deliberately does without. First step, so a formatting failure
      # reports before the suite spends five minutes getting to the same place.
      - name: Formatting
        run: make check-fmt

      # Locally the mcpkit replace hides a pin that was never tagged, and from
      # outside it cannot resolve. Needs Go and the network, hence not `gates`.
      - name: Every panyam pin is tagged
        run: python3 scripts/check_tagged_requires.py

      - name: Vet
        run: make vet

      - name: Test every module
        run: make test GOTESTFLAGS='-v -race -timeout 300s'

  # The web frontend's unit tests (vitest). Node only: the bundle the Go binary
  # embeds is committed, so nothing here needs Go or mcpkit.
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: surfaces/web/web/package-lock.json
      - run: make test-web

  test-examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chakra/main
    steps:
      # Every module replaces mcpkit with ../../mcpkit/main so local work
      # tracks mcpkit's main branch. Lay the runner out the same way as a
      # local checkout: chakra/main and mcpkit/main side by side.
      - uses: actions/checkout@v7
        with:
          path: chakra/main
      - uses: actions/checkout@v7
        with:
          repository: panyam/mcpkit
          ref: main
          path: mcpkit/main

      - uses: actions/setup-go@v7
        with:
          go-version-file: chakra/main/go.mod
          cache-dependency-path: chakra/main/**/go.sum

      - name: Test every example
        run: make test-examples GOTESTFLAGS='-v -race -timeout 300s'
