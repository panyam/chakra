name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Whole-tree scan, by magic bytes rather than filename. The local pre-commit
  # hook is opt-in and bypassable with --no-verify, so this is the actual gate.
  no-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/check-no-binaries.sh
      - run: sh scripts/check-ext-isolation.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Run chakra tests
        run: go test ./... -v

      - name: Run host tests
        run: cd host && go test ./... -v

      - name: Run ext/checkpoint tests
        run: cd ext/checkpoint && go test ./... -v -race

      - name: Run ext/files tests
        run: cd ext/files && go test ./... -v -race

      # Commands here are this test binary re-executed, so nothing needs
      # installing. The exec_live tag runs the same surface under a real
      # sandbox-exec and is darwin-only, so no sandbox backend is exercised on
      # this runner: the platform's own backend refuses and the tests name
      # Unconfined explicitly. See the module README.
      - name: Run ext/exec tests
        run: cd ext/exec && go test ./... -v -race -timeout 180s

      # The lsp suite drives a stub language server that is this test binary
      # re-executed, so it needs no server installed. The lsp_live tag runs the
      # same surface against a real gopls and is deliberately not wired here.
      # Explicit timeout, well above the ~45s this takes, so a hang produces a
      # goroutine dump naming the blocked call instead of a bare line at the
      # 600s default.
      - name: Run ext/lsp tests
        run: cd ext/lsp && go test ./... -v -race -timeout 180s

      - name: Run surfaces shared-module tests
        run: cd surfaces && go test ./... -v

      - name: Run agentchat (surfaces/chat) tests
        run: cd surfaces/chat && go test ./... -v

      - name: Run agentweb (surfaces/web) tests
        run: cd surfaces/web && go test ./... -v

      - name: Run store/redis tests
        run: cd store/redis && go test ./... -v

      - name: Run store/gorm tests
        run: cd store/gorm && go test ./... -v

  test-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run agent-async example test
        run: cd examples/agent-async && go test ./... -v

      - name: Run critic example test
        run: cd examples/critic && go test ./... -v

      - name: Run multi-agent example test
        run: cd examples/multi-agent && go test ./... -v
