syntax = "proto3";

package chakra.web.v1;

option go_package = "github.com/panyam/chakra/surfaces/web/gen/go/chakra/web/v1;webv1";

// HostService is the web bridge over agent/host.App: the same surface-agnostic
// host the terminal agentchat drives, reached from a browser instead of a TTY.
// It maps onto the three host interaction shapes (see docs/AGENT_WEB_UI_EPIC.md
// "Three wire categories"):
//   - Watch        — push, the retained event stream (App.Subscribe).
//   - Submit        — a turn (App.RunTurn).
//   - Dispatch      — a slash command (App.Dispatch -> CmdResult).
//   - RespondToAsk  — the multi-surface ask barrier (App.RespondToAsk).
//   - queries       — point-to-point reads of host state (ListSessions, GetStatus).
//
// One agentweb server can host many concurrent conversations, each its own
// live host.App. Every request carries a session_id routing field on its
// envelope that selects the App it acts on (an empty session_id routes to a
// default session created at startup, so a client that predates multi-session
// keeps working unchanged). The web-session lifecycle RPCs (CreateSession,
// ListWebSessions, CloseSession) mint, enumerate, and tear down those Apps.
// Note session_id is a routing field on each request, never part of an event
// payload — the Frame stays event-flat (agent/CONSTRAINTS A2).
service HostService {
  // Watch streams host events: the retained backlog replayed from offset 0,
  // then live events, until the client disconnects. It drains App.Subscribe;
  // a TUI Observer and a Watch client on one App see the same stream.
  rpc Watch(WatchRequest) returns (stream Frame);

  // Submit runs one conversational turn (App.Submit). The turn's events arrive
  // on Watch; this returns when the turn finishes (an error if it failed).
  // While a turn is already running it queues the input as a steer for that
  // turn and returns at once with steered set.
  rpc Submit(SubmitRequest) returns (SubmitResponse);

  // Dispatch runs a slash command (App.Dispatch) and returns its CmdResult.
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);

  // RespondToAsk answers a pending elicitation/approval by the AskID a client
  // read off a Frame (App.RespondToAsk). First responder wins.
  rpc RespondToAsk(RespondToAskRequest) returns (RespondToAskResponse);

  // ListSessions returns one page of persisted sessions (App.SessionsPage).
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);

  // GetStatus returns the active model label and run id (App.ModelLabel /
  // App.RunID) — the status-line read.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // CreateSession mints a fresh conversation (a new host.App built from the
  // server's config) and returns its session_id. Subsequent requests carrying
  // that session_id route to the new App.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);

  // ListWebSessions returns the session_ids of every live web session (App)
  // the server currently hosts, including the default one. This is the roster
  // of concurrent conversations, distinct from ListSessions (which pages the
  // persisted RunStore runs inside one App).
  rpc ListWebSessions(ListWebSessionsRequest) returns (ListWebSessionsResponse);

  // CloseSession closes the App for session_id and drops it from the roster.
  // An unknown session_id is CodeNotFound.
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);

  // ResizeProcess sets a terminal process's size, so a terminal view can fit
  // its panel (#218). source and process_id are the process-output event's
  // Source and ID. A process that isn't a terminal, has exited or is unknown
  // is FailedPrecondition.
  rpc ResizeProcess(ResizeProcessRequest) returns (ResizeProcessResponse);

  // WriteProcess sends what the user typed in a terminal view to the
  // process's input. It comes from the user, so it doesn't pass the approval
  // gate, and it doesn't enter the model's context.
  rpc WriteProcess(WriteProcessRequest) returns (WriteProcessResponse);
}

message ResizeProcessRequest {
  // session_id selects the conversation (App). Empty routes to the default.
  string session_id = 1;
  string source = 2;
  string process_id = 3;
  int32 cols = 4;
  int32 rows = 5;
}
message ResizeProcessResponse {}

message WriteProcessRequest {
  // session_id selects the conversation (App). Empty routes to the default.
  string session_id = 1;
  string source = 2;
  string process_id = 3;
  string data = 4;
}
message WriteProcessResponse {}

message WatchRequest {
  // session_id selects the conversation (App) to stream. Empty routes to the
  // default session.
  string session_id = 1;
  // resume_after is how many events this client has already applied. The
  // replay always starts at offset 0 in the same order, so the server skips
  // that many and sends only what the client hasn't seen. A reconnecting client
  // passes its count so it doesn't apply the backlog twice.
  uint64 resume_after = 2;
}

// Frame is one host event on the wire. kind is the HostEvent.Kind
// discriminator; payload is the event's own JSON, json.Marshal(HostEvent). It
// is a 1:1 projection of the A2 wire-serializable event, never a per-kind proto
// schema (agent/CONSTRAINTS A2 forbids a translation layer). The client decodes
// payload as JSON keyed by kind. Some HostEvent kinds still carry live pointers
// (TaskStatus, Task, and the Failover inside a command result); until those get
// serializable snapshots (issue 994) their frame carries a minimal payload.
message Frame {
  string kind = 1;
  bytes payload = 2;
}

message SubmitRequest {
  string input = 1;
  // session_id selects the conversation (App). Empty routes to the default.
  string session_id = 2;
  // response_schema, a JSON Schema document, asks for this turn's final
  // answer as JSON valid against it, on the turn-done event's
  // Result.structured (Result.structuredError says why when no attempt
  // validated). Empty asks for nothing.
  string response_schema = 3;
}
message SubmitResponse {
  // steered is true when a turn was already running: the input was queued
  // for that turn's next model call (or the next turn, if it arrived after
  // the last one) and Submit returned without waiting.
  bool steered = 1;
}

message DispatchRequest {
  string line = 1;
  // session_id selects the conversation (App). Empty routes to the default.
  string session_id = 2;
}
// kind is CmdResult.Kind; payload is json.Marshal(CmdResult) — the same
// data-only projection as Frame, so a web surface renders a command result the
// way the terminal does. quit echoes CmdResult.Quit for a /quit line.
message DispatchResponse {
  string kind = 1;
  bytes payload = 2;
  bool quit = 3;
}

message RespondToAskRequest {
  int64 ask_id = 1;
  // result is json.Marshal(core.ElicitationResult).
  bytes result = 2;
  string by = 3;
  // session_id selects the conversation (App) whose ask is being answered.
  // Empty routes to the default.
  string session_id = 4;
}
message RespondToAskResponse {}

message ListSessionsRequest {
  string cursor = 1;
  // session_id selects the conversation (App) whose persisted runs are paged.
  // Empty routes to the default.
  string session_id = 2;
}
// runs is json.Marshal([]agent.RunInfo); active_run_id is the current session.
message ListSessionsResponse {
  bytes runs = 1;
  bool has_more = 2;
  string active_run_id = 3;
}

message GetStatusRequest {
  // session_id selects the conversation (App). Empty routes to the default.
  string session_id = 1;
}
message GetStatusResponse {
  string model_label = 1;
  string run_id = 2;
  // providers lists the session's connection names, sorted, for the header's
  // model picker. Empty when the session runs on a single fixed model.
  repeated string providers = 3;
  // active_provider is the connection /provider last selected, one of
  // providers. Empty when providers is.
  string active_provider = 4;
}

message CreateSessionRequest {
  // provider is the model this session talks to, with the key the browser
  // holds. A server started with a session builder (agentweb --byok) requires
  // it; one that builds every session from its own config ignores it.
  ProviderSpec provider = 1;
  // profile picks which kind of session to build: "" or "chat" is the
  // server's default, and "coding" is the coding agent when the server has
  // one (agentweb --coding). An unknown profile is InvalidArgument.
  string profile = 2;
}
message CreateSessionResponse {
  // session_id of the freshly created conversation (App).
  string session_id = 1;
}

// ProviderSpec names a model endpoint and the key for it. The key lives in the
// session's provider for as long as the session does, in server memory only:
// it is never persisted or logged.
message ProviderSpec {
  // type is a connection type (openai, anthropic, gemini, openrouter, litellm,
  // ollama, lmstudio), or "demo" for the offline demo provider, which needs no
  // key or model.
  string type = 1;
  // base_url overrides the type's default API root.
  string base_url = 2;
  string model = 3;
  string api_key = 4;
}

message ListWebSessionsRequest {}
message ListWebSessionsResponse {
  // session_ids of every live web session (App), including the default.
  repeated string session_ids = 1;
  // sessions holds the same ids with the kind of each, so a browser that
  // didn't create a session can still show it on the right page (#244).
  repeated WebSession sessions = 2;
}

// WebSession is one entry in the server's roster.
message WebSession {
  string session_id = 1;
  // profile is the kind of session, such as "coding". It is empty for a
  // chat session.
  string profile = 2;
  // path is the page that shows the session: "/" for chat, or the
  // profile's page, such as "/code/".
  string path = 3;
}

message CloseSessionRequest {
  // session_id of the conversation (App) to close.
  string session_id = 1;
}
message CloseSessionResponse {}
